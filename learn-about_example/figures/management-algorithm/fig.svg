<svg viewBox="0 0 740 410" role="img" aria-label="Flowchart. Cervical cord compression on MRI. If there are signs or symptoms of myelopathy, grade severity with the mJOA: severe (11 or less) and moderate (12 to 14) get surgery, a strong recommendation; mild (15 to 17) gets surgery or a supervised trial of structured rehabilitation with close follow-up, a weak recommendation, with surgery if the patient deteriorates and consideration of surgery if they fail to improve. If there is no myelopathy, ask about radiculopathy: with it, counsel on the higher risk and offer surgery or close follow-up; without it, no prophylactic surgery, counsel, teach warning signs, and follow up.">
